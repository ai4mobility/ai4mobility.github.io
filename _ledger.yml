  - id: m7-gnn-road-network
    file: GNN_On_A_Road_Network_Companion.html
    kind: companion
    module: 3
    session: gnn-week
    status: published
    dest: site/module3/notes6-message-passing.md#message-passing
    mounted: site/_static/companions/GNN_On_A_Road_Network_Companion.html
    notes: 'SIX tabs since 2026-09-21 (tab 5 "Attention: a learned aggregator" inserted before the fit
      card; see the tail of this note). A random irregular street network is generated in the browser (perturbed lattice,
      edges dropped keeping connectivity, degrees 1-5) and one message-passing step is exploded at any clicked
      node, so varying degree is visibly absorbed by the aggregation rather than the weights. Tab 2 gives
      every intersection the IDENTICAL input feature, so all output variation is structural: mean and max
      with no edge feature stay at 1 distinct state at every depth, sum separates immediately - the sum>mean/max
      expressiveness gap, live. Tab 3 animates queue spillback against the L-hop receptive field. Tab 4
      is the measured experiment (PyTorch, 3 seeds, tested on unseen networks of unseen size): depth-vs-horizon,
      L=1 deficit 1.6x at K=1 growing to 2.4x at K=3; max aggregator 4.3x better than mean at L=3/K=3; parameter
      counts 1,121-4,337 with no N in any of them. Numbers are baked from sweep.json via a __RESULTS__ placeholder
      - RE-INJECT the HTML if the sweep is ever re-run. Paired deliberately with m7-newell-lwr-cnn: that
      one is the corridor case (convolution), this one the network case (message passing).
      TAB 5, added 2026-09-21, answers "does graph attention need the topology": a transformer layer over a
      road graph, q_u = WQ[c_u,1], k_(v-u) = WK[c_v,e_(v-u)], val = c_v, d = 2. Panel 1 is a four-link
      example small enough to check on paper, with live sliders; its hand-set weights make the attention
      ranking FLIP with the query node''s own congestion (upstream governs an empty link, downstream a full
      one) at c_C = (1 + c_U - c_D)/2 = 0.325 at the defaults - which is also the demonstration that
      GAT-2018''s additive score cannot do this. Panel 2 runs the same 10-parameter layer on the generated
      network and FITS IT IN THE BROWSER (analytic gradient + Adam, 300 steps, 0.4-0.7 s) against the same
      spillback rule. Measured 6-seed table is baked in: test RMSE 0.0286 typed / 0.0556 masked-untyped /
      0.0839 full attention / 0.0870 persistence - support buys 34%, direction buys a further 49%, and full
      attention clears persistence by only 4%. Seed 5 is reported as a train-test gap (0.0143 train, 0.0810
      test, every restart the same), not hidden. Reproducer is attn_roadnet.py (see m7-gnn-attention-repro),
      which regenerates every one of those numbers exactly.'
