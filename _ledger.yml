      are downloaded and the counts are still exact. Drawn with the same encoding as
      the CNN architectures companion (height = feature-map size, width = channels),
      so cliff = a head follows, V = a decoder, flat = the representation is the
      product. Mounted at the TOP of 1.5 on purpose - it introduces representation
      learning rather than following it. Tab 4 is the hinge: what objective trained
      each body, and the computed finding that the three largest bodies here
      (385,199,361 params) needed zero hand labels, which motivates word2vec and
      contrastive learning directly.

