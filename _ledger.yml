  - id: m1-cnn-architectures
    file: CNN_Architectures_Companion.html
    kind: companion
    module: 1
    session: 2026-09-03
    status: published
    dest: site/module1/notes.md#cnn-architectures
    mounted: site/_static/companions/CNN_Architectures_Companion.html
    notes: >-
      "CNN architectures: LeNet to ResNet, and how to choose." Six tabs: the ILSVRC arc,
      an interactive layer-by-layer stack viewer for eight real models (height = feature-map
      size, width = channels, recolourable by parameter share or compute share), the four
      architectural moves with their arithmetic, a sortable cost/accuracy table plus a Pareto
      plot, all seven pretrained nets run on the five course frames, and a four-question
      backbone chooser. Answers the question the convolution and scooter-kid sections raise
      but do not settle -- which backbone, and what does it cost. Closes section 1.2.
      Key findings: ImageNet-1k has NO person/pedestrian/child/cyclist class; the benchmark
      ranking does not survive the trip to our frames (ResNet-152 says "amphibian" on the
      stop-bar frame, ResNet-18 says "sports car"); dense heads hold 89-96% of parameters
      but under 9% of the compute; and the two skip-connection experiments disagree with
      each other in a way the page states rather than hides.

