      (trains both lane models and the classical baseline, ~9 min -- run it with nohup,
      a Bash call caps at 2 min; writes partB_eval.npz at ~31 MB which is NOT kept),
      partB_sal.py (saliency accounting + the randomisation check), figs_A.py / figs_B.py
      (the seven Saliency_*.png at 2x), export_payload.py (payload.js) and check.py
      (Playwright: screenshots every tab, fails on any unresolved data-num or console
      error). partB_models.pt is kept so the saliency scripts run without retraining.
      partA.py reads frames from $SALIENCY_FRAMES, default ../Labs/data/cnn.
      The page carries NO hand-typed numbers: every figure is injected at load time from
      the three JSONs through data-num attributes, so a rerun cannot leave the prose stale.
      README.md has the rebuild order.

