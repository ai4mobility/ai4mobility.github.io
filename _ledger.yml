  - id: m7-lab5-graph-attention
    file: site/module3/lab5_graph_attention.ipynb
    kind: lab
    module: 3
    session: gnn-week
    status: published
    dest: site/labs.md + _toc.yml Labs part
    notes: 'Lab 5. One message-passing layer, SIX aggregators: mean/sum/max/attn plus two that encode domain
      knowledge at zero parameter cost - dmax (max over DOWNSTREAM only, i.e. queues back up) and umean
      (mean over UPSTREAM only, i.e. flow arrives from upstream). Two ground truths: rule A spillback (selector
      is a known max) and rule B merge composition (weights proportional to Greenshields flow q=k(1-k),
      so influence is NON-MONOTONE - an empty feeder and a jammed feeder both deliver nothing, the one at
      capacity dominates). Optional section 9 adds rule C (who governs me depends on my own density) and
      measures the GAT-2018 static-attention limit with a ranking-flip rate. Executed, 29 cells, 3 figures,
      ~3 min CPU, no downloads. HEADLINE, six seeds: attention ties dmax on rule A (0.0080 vs 0.0081) at
      DOUBLE the parameters and 2.7x vs 1.6x seed spread; attention wins rule B (0.0110) but umean - which
      knows nothing but the support - is right behind at 0.0122. So: right support >> learned weighting
      > generic reduction. Do not restate the lab as ''attention wins''.'
