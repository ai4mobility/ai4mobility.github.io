    notes: '"Your own tokens: the transformer as a research architecture." Six tabs, 264 KB, SINGLE FILE
      (data inlined at build time, no sidecar). The THIRD module-2 embed, after tokenization and word2vec->BERT.
      Purpose: the LLM/VLM thread teaches what a transformer does with language; this one teaches PhD students
