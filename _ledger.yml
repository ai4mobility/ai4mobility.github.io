# =============================================================================
# CONTENT LEDGER — AI for Mobility course notes
# =============================================================================
# One row per teaching artifact. This is the inventory that makes incremental
# note-building possible: any session can read this file and know what exists,
# where it belongs, and what still has to be written.
#
# Companion process doc: NOTES_GUIDE.md
#
# status values
#   raw         file exists, nothing written about it in the notes yet
#   drafted     prose exists in a notes chapter but has not been reviewed
#   integrated  reviewed, wired into a notes chapter, cross-linked
#   published   integrated AND pushed live to ai4mobility.github.io
#   superseded  replaced by something else; kept only for history
#   debt        promised on the site or in the syllabus but not built yet
#
# kind values
#   companion   self-contained interactive HTML page
#   lab         Jupyter notebook students run
#   case        worked example / narrative case study
#   handout     assignment, rubric, or template given to students
#   notes       a notes chapter on the site
#   deck        slide deck
#   internal    instructor-only; never goes to students
#
# paths are relative to the AI_Mobility_Class folder unless they start with
# "site/", which means the ai4mobility.github.io repo root.
# =============================================================================

meta:
  updated: 2026-08-24
  notes_granularity: one chapter per module
  chapter_files: site/moduleN/notes.md
  companion_mount: site/_static/companions/   # served at _static/companions/<file>
  intake_folder: inbox/                       # drop new slides/materials here

