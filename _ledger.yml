  - id: m4-lab6-vit-finetune
    file: site/module6/lab6_vit_finetune.ipynb
    kind: lab
    module: 6
    session: '2026-10-01'
    status: published
    dest: site/labs.md + _toc.yml Labs part + module6/index.md
    notes: 'Lab 6. Turns the Sept 10 transfer dial on ViT-Tiny (5,524,995 params, Apache-2.0) over 2,949
      FL511 Tampa Bay camera frames collected 2026-09-21 in six sweeps through sunset. Camera-disjoint
      split, daylight-only training. Daylight test: majority 35.5, 12 hand features 37.7, head-only at
      the fine-tuning LR 34.5 (UNDERTRAINED - do not quote as "frozen features are useless"), converged
      logistic probe 56.5, last block 51.4, last four blocks 64.0, full fine-tune 71.2. The dial-0
      artifact is deliberate teaching material: dial position and optimizer are coupled, and at lr 1e-3
      dial 0 recovers to 57.0. After dark the full fine-tune reads 67.6, which is NOT robustness - the
      teacher detector collapses from 10.33 to 2.13 vehicles/frame and 11.2% to 40.4% empty frames, so
      the student agrees with a failing teacher. Banner-crop control costs only 2 points (69.2 vs 71.2),
      so the model is not reading the burned-in caption. Teacher also under-counts on bad optics:
      blurriest daylight quartile 6.32 vehicles vs sharpest 11.27. Timing on 2 CPU threads: Tiny 13.6
      ms/frame (73.6 fps) vs Base 143.0 ms; teacher 1.041 s/frame. ViT-Base full fine-tune was killed
      by RAM at batch 16 in 8 GB - reported as a finding, not a gap.'
