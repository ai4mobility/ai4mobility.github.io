    notes: '"Your own tokens: the transformer as a research architecture." Six tabs, 264 KB, SINGLE FILE
      (data inlined at build time, no sidecar). The THIRD module-2 embed, after tokenization and word2vec->BERT.
      Purpose: the LLM/VLM thread teaches what a transformer does with language; this one teaches PhD students
      that the encoder stack is domain-agnostic and can be pointed at their own data. Spine: a transformer
      is a learned, input-dependent adjacency matrix over whatever you call a token. Tab 1 splits BERT into
      the replaceable gold column (tokenizer + 23,837,184 embedding weights + head) and the kept green column
      (85,054,464 encoder weights). Tab 2 is the interactive core: all 207 METR-LA detectors on a clickable
      map, toggling between the DCRNN road-network adjacency (Gaussian kernel, sigma=2435.3 m, kappa=0.1,
      1,349 edges, mean degree 6.52) and the measured correlation neighbourhood in three time bands -- the
      two agree only 44.4% and the AM/PM neighbourhoods agree only 48.4%, which IS the argument for computing
      A from the input. Tab 3 gives three token designs at equal depth (traffic flow / multimodal car-following
      / infrastructure interdependency), each with a full fit-card row set. Tab 4 is a live permutation-equivariance
      demo (real 8-dim attention head in JS) plus the ViT PE ablation and the measured 97.4% window-indistinguishability
      result. Tab 5 is the evaluation close. Tab 6 is the fit card + four judgment questions. Opens on detector
      768066, chosen BY RULE (closest to the fleet-mean overlaps among detectors that congest) rather than
      hand-picked -- do not swap it for a more dramatic one. Move to module2/notes.md with the other two
      embeds when the weekly pass creates it.'

