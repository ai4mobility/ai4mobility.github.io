  - id: m1-word2vec-cost-figures
    file: Word2Vec_Vocabulary_Cost.svg
    kind: internal
    module: 1
    session: 2026-09-10
    status: drafted
    dest: site/module1/notes.md#word2vec
    notes: 'Slide 3b (SVG + PNG 3200x1800, plus _1/_2/_3 build reveals): why a huge vocabulary breaks two
      of word2vec''s three cost sites and not the third. The architecture spine carries three numbered cost
      badges; one row per site. (1) the input one-hot is NOT a real cost -- a one-hot matmul is a row lookup,
      O(d) independent of V, 99.9973% of the multiplications would be times zero. (2) the output softmax
      IS -- d*V = 3,674,100 per pair, 60.5 T per epoch, fixed 6,124x by negative sampling or 2,423x by hierarchical
      softmax. (3) the two tables ARE -- 1.8 B parameters and a 3.4 GB file at Google-News scale, trimmed
      but not fixed by Zipf. Instance is text8 (V=36,741, d=100, k=5), NOT Lab 2''s toy, because V=81 is
      the regime where the question does not arise. Numbers: word2vec_cost_numbers.py.

