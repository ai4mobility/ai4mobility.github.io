      "How word2vec is actually trained" -- faithful numpy re-implementation of
      Mikolov's word2vec.c (skip-gram + negative sampling) run on two REAL
      vocabularies: text8 (5.1M tokens, V=36,741) and NHTSA ODI complaint
      narratives 2020-2024 (4.5M tokens, V=10,343). Structured as the six boxes of
      the C source: min_count, subsampling (code formula, not the paper's), random
      shrinking window, unigram^0.75 table, the SGNS update, linear alpha decay.
      PPMI+SVD baseline on BOTH halves, two evaluation closes, fit card, your-turn
      set. Executed with outputs; full run ~22 min, PRESET="fast" ~4 min. Deeper
      companion to m1-lab2, which stays the short lab. NOT on the site (Hao's call,
      Aug 31 2026).

