      timm vit_base_patch16_224.orig_in21k_ft_in1k, the ViT authors'' own JAX checkpoint; torchvision vit_b_16
      IMAGENET1K_V1 is the small-data contrast. Headline results: block 1 head 5 is an identity head (attention
      distance 0.02 px, 99.88% self-mass, 0% on [class]) and block 1 spans 0.02-116.2 px, reproducing Figure
      11 -- while the ImageNet-1k-only checkpoint has NO head under 98.8 px in block 1, which is the paper''s
      data-scale claim in a table. Head to head at a matched 224x224 input on the stop-bar frame: asked
      "traffic light", ViT class relevance 2.09x lift on the five signal heads vs ResNet-50 Grad-CAM 0.56x
      (the same ResNet scored 4.66x at 672x416 in m1-saliency-maps -- input size, not the model); asked
      "sports car", 0.91x/0.05x on the heads and 2.59x/3.81x on the lead car. Tab 6 runs a deletion test:
      class-free rollout is WORSE than random for a non-top class, raising p(traffic light) to 4.28x. Tab
