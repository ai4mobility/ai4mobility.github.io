      margin runs +0.005 at L0 to +0.145 at L10 and back to +0.126 at L12, and that dip is taught. Tab 5
      is the probe: GloVe-token-only is EXACTLY at the 0.333 floor on the sense task (identical inputs,
      different labels -- a ceiling, not a weak model), GloVe-context-mean gets sense 0.86 but only 0.62
      at naming the word, BERT 1.00/0.96/0.92-with-cue-deleted. Two of six masked-LM predictions MISS on
      purpose (porch/overhead for a truck tail light) -- bert-base read Wikipedia, not complaints; that
      is the hand-off to Module 4 adaptation. THE REBUILD dropped the old tabs 3 and 5 (the two static/
