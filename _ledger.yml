      two agree only 44.4% and the AM/PM neighbourhoods agree only 48.4%, which IS the argument for computing
      A from the input. Tab 3 gives three token designs at equal depth (traffic flow / multimodal car-following
      / infrastructure interdependency), each with a full fit-card row set. Tab 4 is a live permutation-equivariance
      demo (real 8-dim attention head in JS) plus the ViT PE ablation and the measured 97.4% window-indistinguishability
      result. Tab 5 is the evaluation close. Tab 6 is the fit card + four judgment questions. Opens on detector
      768066, chosen BY RULE (closest to the fleet-mean overlaps among detectors that congest) rather than
