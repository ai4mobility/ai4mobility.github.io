42) scale(1.215)"><path d="M9,3.6 H15 V8.2 H9 Z" fill="#fff"/><path d="M11.4,8.2 H12.6 V10.4 H19.6 V14.6 H18.4 V11.6 H12.6 V14.6 H11.4 V11.6 H5.6 V14.6 H4.4 V10.4 H11.4 Z" fill="#fff"/><path d="M2,14.6 H8 V19.6 H2 Z M9,14.6 H15 V19.6 H9 Z M16,14.6 H22 V19.6 H16 Z" fill="#fff"/></g><text x="64" y="166" font-size="14" font-weight="700" fill="#005432" text-anchor="start" >TMC lead</text><text x="64" y="183" font-size="14" font-weight="700" fill="#005432" text-anchor="start" >agent</text><line x1="150" y1="318" x2="946" y2="318" stroke="#CAD2D8" stroke-width="1" stroke-dasharray="2 5"/><circle cx="36" cy="318" r="18" fill="#006747" stroke="#006747" stroke-width="1.6"/><g transform="translate(23.58 305.58) scale(1.035)"><path d="M12,2.6 c-3.9,0 -6.8,2.9 -6.8,6.6 c0,4.7 6.8,12.2 6.8,12.2 s6.8,-7.5 6.8,-12.2 c0,-3.7 -2.9,-6.6 -6.8,-6.6 Z" fill="#fff"/><path d="M9.3,9.3 a2.7,2.7 0 1 0 5.4,0 a2.7,2.7 0 1 0 -5.4,0 Z" fill="#006747"/></g><text x="64" y="316" font-size="14" font-weight="700" fill="#005432" text-anchor="start" >Desk</text><text x="64" y="333" font-size="14" font-weight="700" fill="#005432" text-anchor="start" >agents</text><line x1="150" y1="470" x2="946" y2="470" stroke="#CAD2D8" stroke-width="1" stroke-dasharray="2 5"/><rect x="18" y="452" width="36" height="36" rx="5.4" fill="#CFC493" stroke="#005432" stroke-width="1.6"/><g transform="translate(21.42 455.42) scale(1.215)"><path d="M6,9 V5.4 a1.4,1.4 0 0 1 1.4,-1.4 H16.6 a1.4,1.4 0 0 1 1.4,1.4 V9 H15.8 V6.2 H8.2 V9 Z" fill="#005432"/><path d="M5,8 H19 a2,2 0 0 1 2,2 V16.5 a2,2 0 0 1 -2,2 H5 a2,2 0 0 1 -2,-2 V10 a2,2 0 0 1 2,-2 Z" fill="#005432"/><path d="M5,18 H8.2 V21 H5 Z M15.8,18 H19 V21 H15.8 Z" fill="#005432"/><path d="M13.4,9.2 L8.9,13.9 H11.6 L10.4,17.4 L15.1,12.5 H12.4 Z" fill="#CFC493"/></g><text x="64" y="468" font-size="14" font-weight="700" fill="#005432" text-anchor="start" >Crews</text><text x="64" y="485" font-size="14" font-weight="700" fill="#005432" text-anchor="start" >in the field</text><rect x="150" y="128" width="178" height="80" rx="8" fill="#fff" stroke="#005432" stroke-width="1.6"/><text x="160" y="150" font-size="15" font-weight="700" fill="#005432" text-anchor="start" >1  Read</text><text x="160" y="170" font-size="13.5" font-weight="400" fill="#303434" text-anchor="start" >signal system, eSTORM,</text><text x="160" y="188" font-size="13.5" font-weight="400" fill="#303434" text-anchor="start" >what the TMC knows</text><rect x="346" y="128" width="196" height="80" rx="8" fill="#fff" stroke="#005432" stroke-width="1.6"/><text x="356" y="150" font-size="15" font-weight="700" fill="#005432" text-anchor="start" >2  Brief each desk</text><text x="356" y="170" font-size="13.5" font-weight="400" fill="#303434" text-anchor="start" >objective, crews it owns,</text><text x="356" y="188" font-size="13.5" font-weight="400" fill="#303434" text-anchor="start" >signals to hold, yard share</text><line x1="328" y1="168" x2="344" y2="168" stroke="#005432" stroke-width="1.8" marker-end="url(#aE)"/><rect x="346" y="252" width="268" height="132" rx="10" fill="#EDEBD1" stroke="#CFC493" stroke-width="1.6"/><text x="358" y="275" font-size="15" font-weight="700" fill="#005432" text-anchor="start" >3  Each desk plans its own crews</text><circle cx="372" cy="300" r="11" fill="#006484" stroke="#006484" stroke-width="1.6"/><g transform="translate(364.41 292.41) scale(0.632)"><path d="M13.9,8.6 a2.7,2.7 0 1 0 5.4,0 a2.7,2.7 0 1 0 -5.4,0 Z" fill="#fff"/><path d="M16.2,12.6 c3.5,-0.3 6.3,2 6.3,5.6 v1.3 h-4.6 v-1 c0,-2.2 -0.6,-4.2 -1.7,-5.9 Z" fill="#fff"/><path d="M5.3,7.9 a3.3,3.3 0 1 0 6.6,0 a3.3,3.3 0 1 0 -6.6,0 Z" fill="#fff"/><path d="M1.8,19.5 v-0.9 c0,-3.7 3,-6.3 6.8,-6.3 s6.8,2.6 6.8,6.3 v0.9 Z" fill="#fff"/></g><text x="392" y="305" font-size="13.5" font-weight="400" fill="#303434" text-anchor="start" >SAT loops</text><rect x="361" y="317" width="22" height="22" rx="3.3" fill="#CFC493" stroke="#005432" stroke-width="1.6"/><g transform="translate(363.09 319.09) scale(0.743)"><path d="M6,9 V5.4 a1.4,1.4 0 0 1 1.4,-1.4 H16.6 a1.4,1.4 0 0 1 1.4,1.4 V9 H15.8 V6.2 H8.2 V9 Z" fill="#005432"/><path d="M5,8 H19 a2,2 0 0 1 2,2 V16.5 a2,2 0 0 1 -2,2 H5 a2,2 0 0 1 -2,-2 V10 a2,2 0 0 1 2,-2 Z" fill="#005432"/><path d="M5,18 H8.2 V21 H5 Z M15.8,18 H19 V21 H15.8 Z" fill="#005432"/><path d="M13.4,9.2 L8.9,13.9 H11.6 L10.4,17.4 L15.1,12.5 H12.4 Z" fill="#CFC493"/></g><text x="392" y="333" font-size="13.5" font-weight="400" fill="#303434" text-anchor="start" >generators and beacons, checked</text><circle cx="372" cy="356" r="11" fill="#fff" stroke="#303434" stroke-width="1.6"/><g transform="translate(364.41 348.41) scale(0.632)"><path d="M6.8,6.2 H12.4 L18.6,10.6 V19.8 a1.6,1.6 0 0 1 -1.6,1.6 H7 a1.6,1.6 0 0 1 -1.6,-1.6 V7.6 a1.4,1.4 0 0 1 1.4,-1.4 Z" fill="#303434"/><path d="M14.9,4.4 L18.5,7 L17.1,8.9 L13.5,6.3 Z" fill="#303434"/><path d="M7.4,8 H11.2 V9.7 H7.4 Z" fill="#fff"/><path d="M12,11.6 C12,11.6 9.4,14.8 9.4,16.5 a2.6,2.6 0 0 0 5.2,0 C14.6,14.8 12,11.6 12,11.6 Z" fill="#fff"/></g><text x="392" y="361" font-size="13.5" font-weight="400" fill="#303434" text-anchor="start" >refueling</text><text x="604" y="377" font-size="13" font-weight="400" fill="#005432" text-anchor="end" font-style="italic">at the same time</text><line x1="450" y1="208" x2="450" y2="250" stroke="#005432" stroke-width="2.2" marker-end="url(#aE)"/><text x="459" y="234" font-size="13.5" font-weight="700" fill="#005432" text-anchor="start" >brief</text><rect x="634" y="262" width="178" height="106" rx="8" fill="#fff" stroke="#006484" stroke-width="1.6"/><text x="644" y="284" font-size="15" font-weight="700" fill="#005432" text-anchor="start" >4  Report</text><text x="644" y="304" font-size="13.5" font-weight="400" fill="#303434" text-anchor="start" >what it planned,</text><text x="644" y="322" font-size="13.5" font-weight="400" fill="#303434" text-anchor="start" >what it could not cover,</text><text x="644" y="340" font-size="13.5" font-weight="400" fill="#303434" text-anchor="start" >requests to other desks</text><line x1="614" y1="318" x2="632" y2="318" stroke="#006484" stroke-width="1.8" marker-end="url(#aS)"/><rect x="634" y="128" width="312" height="80" rx="8" fill="#fff" stroke="#005432" stroke-width="1.6"/><text x="644" y="150" font-size="15" font-weight="700" fill="#005432" text-anchor="start" >5  Merge, check, send</text><text x="644" y="170" font-size="13.5" font-weight="400" fill="#303434" text-anchor="start" >one plan from all parts; the plan checker;</text><text x="644" y="188" font-size="13.5" font-weight="400" fill="#303434" text-anchor="start" >then the status memo</text><line x1="700" y1="260" x2="700" y2="210" stroke="#006484" stroke-width="2.2" marker-end="url(#aS)"/><text x="709" y="241" font-size="13.5" font-weight="700" fill="#006484" text-anchor="start" >report</text><rect x="684" y="38" width="212" height="46" rx="8" fill="#fff" stroke="#303434" stroke-width="1.4"/><text x="790" y="57" font-size="13" font-weight="400" fill="#303434" text-anchor="middle" >says yes or no to a team move</text><text x="790" y="74" font-size="13" font-weight="400" fill="#303434" text-anchor="middle" >and to a Priority 1 shortage</text><line x1="790" y1="126" x2="790" y2="86" stroke="#303434" stroke-width="1.8" marker-end="url(#aK)" marker-start="url(#aK)"/><rect x="760" y="446" width="180" height="48" rx="9" fill="#fff" stroke="#CAD2D8" stroke-width="1.5"/><rect x="777" y="457" width="26" height="26" rx="3.9" fill="#CFC493" stroke="#005432" stroke-width="1.6"/><g transform="translate(779.47 459.47) scale(0.878)"><path d="M6,9 V5.4 a1.4,1.4 0 0 1 1.4,-1.4 H16.6 a1.4,1.4 0 0 1 1.4,1.4 V9 H15.8 V6.2 H8.2 V9 Z" fill="#005432"/><path d="M5,8 H19 a2,2 0 0 1 2,2 V16.5 a2,2 0 0 1 -2,2 H5 a2,2 0 0 1 -2,-2 V10 a2,2 0 0 1 2,-2 Z" fill="#005432"/><path d="M5,18 H8.2 V21 H5 Z M15.8,18 H19 V21 H15.8 Z" fill="#005432"/><path d="M13.4,9.2 L8.9,13.9 H11.6 L10.4,17.4 L15.1,12.5 H12.4 Z" fill="#CFC493"/></g><circle cx="822" cy="470" r="13" fill="#006484" stroke="#006484" stroke-width="1.6"/><g transform="translate(813.03 461.03) scale(0.747)"><path d="M13.9,8.6 a2.7,2.7 0 1 0 5.4,0 a2.7,2.7 0 1 0 -5.4,0 Z" fill="#fff"/><path d="M16.2,12.6 c3.5,-0.3 6.3,2 6.3,5.6 v1.3 h-4.6 v-1 c0,-2.2 -0.6,-4.2 -1.7,-5.9 Z" fill="#fff"/><path d="M5.3,7.9 a3.3,3.3 0 1 0 6.6,0 a3.3,3.3 0 1 0 -6.6,0 Z" fill="#fff"/><path d="M1.8,19.5 v-0.9 c0,-3.7 3,-6.3 6.8,-6.3 s6.8,2.6 6.8,6.3 v0.9 Z" fill="#fff"/></g><circle cx="854" cy="470" r="13" fill="#fff" stroke="#303434" stroke-width="1.6"/><g transform="translate(845.03 461.03) scale(0.747)"><path d="M6.8,6.2 H12.4 L18.6,10.6 V19.8 a1.6,1.6 0 0 1 -1.6,1.6 H7 a1.6,1.6 0 0 1 -1.6,-1.6 V7.6 a1.4,1.4 0 0 1 1.4,-1.4 Z" fill="#303434"/><path d="M14.9,4.4 L18.5,7 L17.1,8.9 L13.5,6.3 Z" fill="#303434"/><path d="M7.4,8 H11.2 V9.7 H7.4 Z" fill="#fff"/><path d="M12,11.6 C12,11.6 9.4,14.8 9.4,16.5 a2.6,2.6 0 0 0 5.2,0 C14.6,14.8 12,11.6 12,11.6 Z" fill="#fff"/></g><text x="874" y="475" font-size="13.5" font-weight="400" fill="#303434" text-anchor="start" >13 crews</text><line x1="900" y1="208" x2="900" y2="444" stroke="#303434" stroke-width="2.2" marker-end="url(#aK)"/><text x="892" y="432" font-size="13.5" font-weight="700" fill="#303434" text-anchor="end" >only the lead sends</text><path d="M720 368 V 412 H 312 V 232 H 372 V 210" fill="none" stroke="#466069" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#aG)"/><text x="318" y="433" font-size="13.5" font-weight="400" fill="#466069" text-anchor="start" >a request to another desk reaches it in the lead's next brief</text><rect x="14" y="512" width="932" height="36" rx="8" fill="#005432"/><text x="480.0" y="535" font-size="13.5" font-weight="600" fill="#fff" text-anchor="middle" >Kept in code:  one owner per crew  ·  one writer to the field  ·  a person decides  ·  a scripted fallback for every desk</text><metadata><c2pa:manifest></c2pa:manifest></metadata></svg>